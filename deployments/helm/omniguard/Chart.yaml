apiVersion: v2
name: omniguard
description: A Helm chart for the OmniGuard SOC Platform
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kafka
    version: 26.3.0
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: opensearch
    version: 2.15.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch.enabled
  - name: postgresql
    version: 13.2.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
